
name: cloudcost-analyzer

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloudcost-backend
    ports:
      - "8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: sqlite:////app/data/shimo.db
      CORS_ORIGINS: http://localhost:5035,http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - cloudcost-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudcost-frontend
    ports:
      - "5035:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudcost-network

networks:
  cloudcost-network:
    driver: bridge
