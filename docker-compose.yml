services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-analytics-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./cloud_analytics.db
    volumes:
      - ./backend:/app
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - shimo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud-analytics-frontend
    ports:
      - "5035:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - shimo-network

networks:
  shimo-network:
    driver: bridge

volumes:
  data:
    driver: local
