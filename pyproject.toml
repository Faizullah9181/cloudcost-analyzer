[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shimo"
version = "2.0.0"
description = "Shimo - Multi-Cloud Cost Analysis Agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Cloud Analytics Team"}]

dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "strands-agents==1.36.0",
    "strands-agents-tools==0.5.0",
    "boto3==1.39.7",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.1.0",
    "pylint==3.3.7",
    "sqlalchemy==2.0.36",
    "alembic==1.15.2",
    "azure-identity==1.15.0",
    "azure-mgmt-costmanagement==4.0.1",
    "azure-mgmt-subscription==3.1.1",
    "google-cloud-billing==1.13.0",
    "requests==2.32.3",
    "typer==0.12.5",
    "rich==14.0.0",
    "click==8.1.7",
]

[project.scripts]
shimo = "backend.shimo_cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 120
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
]
