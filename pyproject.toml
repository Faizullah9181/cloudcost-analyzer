[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shimo"
version = "2.1.0"
description = "Shimo - Multi-Cloud Cost Analysis Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shimo Contributors" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34",
    "strands-agents[anthropic,ollama,openai]>=1.55,<2.0",
    "boto3>=1.39",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.9",
    "python-dotenv>=1.1",
    "sqlalchemy>=2.0.36,<3.0",
    "azure-identity>=1.19",
    "azure-mgmt-costmanagement>=4.0",
    "azure-mgmt-subscription>=3.1",
    "azure-mgmt-resource>=23.0",
    "google-cloud-billing>=1.13",
    "google-cloud-bigquery>=3.25",
    "google-cloud-asset>=3.27",
    "google-auth>=2.30",
    "requests>=2.32",
    "typer>=0.15",
    "rich>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "pylint>=3.3",
]

[project.scripts]
shimo = "backend.shimo_cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 120
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
]
